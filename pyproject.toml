[project]
name = "stenolang-python"
version = "0.1.0"
description = "A python library for the stenolang protocol (SMP)"
authors = [
    {name = "Methuselah-Nwodobeh",email = "methuselahnwodobeh@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[tool.poetry]
packages = [{include = "stenolang_python_package", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
